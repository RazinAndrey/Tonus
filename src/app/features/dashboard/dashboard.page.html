<app-page-layout>
  <div class="dashboard-cards">
    <app-card-layout [title]="'nav.trainings' | t" [subtitle]="'dashboard.weekDemo' | t">
      <p class="dashboard-card-value">3</p>
      <p class="dashboard-card-caption">{{ 'dashboard.completedTrainings' | t }}</p>
    </app-card-layout>

    <app-card-layout [title]="'dashboard.trainingTime' | t" [subtitle]="'dashboard.weekDemo' | t">
      <p class="dashboard-card-value">{{ 'dashboard.duration' | t }}</p>
      <p class="dashboard-card-caption">{{ 'dashboard.totalTime' | t }}</p>
    </app-card-layout>

    <app-card-layout [title]="'dashboard.activeDays' | t" [subtitle]="'dashboard.weekDemo' | t">
      <p class="dashboard-card-value">5</p>
      <p class="dashboard-card-caption">{{ 'dashboard.activeDaysCaption' | t }}</p>
    </app-card-layout>
  </div>
</app-page-layout>
