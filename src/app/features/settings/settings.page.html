<app-page-layout>
  <app-list-layout class="settings-section">
    <ion-list-header>{{ "settings.appearance" | t }}</ion-list-header>
    <ion-radio-group [value]="theme()" (ionChange)="setTheme($event.detail.value)">
      <ion-item lines="none">
        <ion-radio value="dark">{{ "settings.dark" | t }}</ion-radio>
      </ion-item>
      <ion-item lines="none">
        <ion-radio value="light">{{ "settings.light" | t }}</ion-radio>
      </ion-item>
    </ion-radio-group>
  </app-list-layout>

  <app-list-layout class="settings-section">
    <ion-list-header>{{ "settings.language" | t }}</ion-list-header>
    <ion-radio-group [value]="language()" (ionChange)="setLanguage($event.detail.value)">
      <ion-item lines="none">
        <ion-radio value="ru">{{ "settings.russian" | t }}</ion-radio>
      </ion-item>
      <ion-item lines="none">
        <ion-radio value="en">{{ "settings.english" | t }}</ion-radio>
      </ion-item>
    </ion-radio-group>
  </app-list-layout>

  <app-list-layout [interactive]="false" class="settings-section">
    <ion-list-header>{{ "settings.about" | t }}</ion-list-header>
    <ion-item lines="none">
      <ion-label>{{ "settings.version" | t }}</ion-label>
      <ion-note slot="end" class="settings-value">{{ appVersion }}</ion-note>
    </ion-item>
  </app-list-layout>
</app-page-layout>
