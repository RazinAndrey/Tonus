<app-page-layout title="Настройки" subtitle="Параметры приложения">
  <app-list-layout class="settings-section">
    <ion-list-header>Внешний вид</ion-list-header>
    <ion-radio-group [value]="theme()" (ionChange)="theme.set($event.detail.value)">
      <ion-item lines="none">
        <ion-radio value="dark">Тёмная</ion-radio>
      </ion-item>
      <ion-item lines="none">
        <ion-radio value="light">Светлая</ion-radio>
      </ion-item>
    </ion-radio-group>
  </app-list-layout>

  <app-list-layout class="settings-section">
    <ion-list-header>Язык</ion-list-header>
    <ion-radio-group [value]="language()" (ionChange)="language.set($event.detail.value)">
      <ion-item lines="none">
        <ion-radio value="ru">Русский</ion-radio>
      </ion-item>
      <ion-item lines="none">
        <ion-radio value="en">English</ion-radio>
      </ion-item>
    </ion-radio-group>
  </app-list-layout>

  <app-list-layout class="settings-section">
    <ion-list-header>О приложении</ion-list-header>
    <ion-item lines="none">
      <ion-label>Версия</ion-label>
      <ion-note slot="end" class="settings-value">{{ appVersion }}</ion-note>
    </ion-item>
  </app-list-layout>
</app-page-layout>
