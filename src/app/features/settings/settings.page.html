<app-page-layout>
  <app-list-layout>
    @for (item of items; track item.id; let isLast = $last) {
      <ion-item [lines]="isLast ? 'none' : 'full'">
        <ion-label>
          <h2>{{ item.title }}</h2>
          <p>{{ item.description }}</p>
        </ion-label>
      </ion-item>
    }
  </app-list-layout>
</app-page-layout>
