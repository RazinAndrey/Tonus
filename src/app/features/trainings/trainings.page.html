<app-page-layout>
  <div page-toolbar class="trainings-toolbar">
    <app-search />
  </div>

  @if (trainings$ | async; as trainings) {
    <app-list-layout class="trainings-list">
      @for (training of trainings; track training.id; let isLast = $last) {
        <ion-item [lines]="isLast ? 'none' : 'full'">
          <ion-label class="app-text-truncate">
            <h2>{{ training.title }}</h2>
            <p>{{ training.short_description }}</p>
          </ion-label>
          <ion-icon class="training-chevron" name="chevron-forward-outline" slot="end" aria-hidden="true" />
        </ion-item>
      }
    </app-list-layout>
  }

  <ion-fab slot="fixed">
    <ion-fab-button routerLink="/trainings/training-form" [attr.aria-label]="'training.create' | t">
      <ion-icon name="add" aria-hidden="true" />
    </ion-fab-button>
  </ion-fab>
</app-page-layout>
