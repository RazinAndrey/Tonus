<app-header title="Tonus" menu />

<ion-content [fullscreen]="true">
  @if (workouts(); as list) {
    <ion-list>
      @for (w of list; track w.id) {
        <ion-item>
          <ion-label>
            <h2>{{ w.title }}</h2>
            <p>{{ w.createdAt | date: 'short' }}</p>
          </ion-label>
          <ion-note slot="end">{{ w.durationMinutes }} мин</ion-note>
        </ion-item>
      } @empty {
        <ion-item><ion-label>Нет тренировок</ion-label></ion-item>
      }
    </ion-list>
  } @else {
    <div class="state">Загрузка…</div>
  }
</ion-content>
