@if (email() || phone() || about()) {
  <app-list-layout class="profile-info" [interactive]="false">
    @if (email()) {
      <ion-item class="profile-info__row">
        <ion-label class="profile-info__content">
          <ion-note class="profile-info__label">{{ 'profile.email' | t }}</ion-note>
          <span class="profile-info__value">{{ email() }}</span>
        </ion-label>
      </ion-item>
    }

    @if (phone()) {
      <ion-item class="profile-info__row">
        <ion-label class="profile-info__content">
          <ion-note class="profile-info__label">{{ 'profile.phone' | t }}</ion-note>
          <span class="profile-info__value">{{ phone() }}</span>
        </ion-label>
      </ion-item>
    }

    @if (about()) {
      <ion-item class="profile-info__row">
        <ion-label class="profile-info__content">
          <ion-note class="profile-info__label">{{ 'profile.about' | t }}</ion-note>
          <span class="profile-info__value">{{ about() }}</span>
        </ion-label>
      </ion-item>
    }
  </app-list-layout>
}
