<app-page-layout>
  @if (loading() && !profile()) {
    <app-spinner [text]="'profile.loading' | t" />
  } @else if (loadError() && !profile()) {
    <p>{{ 'profile.loadFailed' | t }}</p>
    <app-button (click)="reload()">{{ 'profile.retry' | t }}</app-button>
  }

  @if (profile(); as profile) {
    <section class="profile">
      <app-profile-hero [name]="profile.name" [level]="profile.level ?? ''" />
      <app-profile-info
        [email]="profile.email"
        [phone]="profile.phone ?? ''"
        [about]="profile.about ?? ''" />
      <app-profile-actions />
    </section>
  }
</app-page-layout>
