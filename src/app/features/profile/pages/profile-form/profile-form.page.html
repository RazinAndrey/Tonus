<app-page-layout>
  @if (loading() && !profile()) {
    <app-spinner [text]="'profile.loading' | t" />
  } @else if (loadError() && !profile()) {
    <p>{{ 'profile.loadFailed' | t }}</p>
    <app-button (click)="reload()">{{ 'profile.retry' | t }}</app-button>
  } @else if (profile()) {
    <section class="profile-form-page">
      <h1>{{ 'page.editProfile' | t }}</h1>
      <form class="profile-form" (submit)="onSubmit($event)">
        <app-input
          [label]="'profile.name' | t"
          autocomplete="name"
          [formField]="profileForm.name"
          [errorText]="nameError()" />
        <app-input [label]="'profile.level' | t" [formField]="profileForm.level" />
        <app-input
          [label]="'profile.emailAddress' | t"
          type="email"
          autocomplete="email"
          [formField]="profileForm.email"
          [errorText]="emailError()" />
        <app-input [label]="'profile.phone' | t" type="tel" autocomplete="tel" [formField]="profileForm.phone" />
        <app-textarea [label]="'profile.about' | t" [formField]="profileForm.about" />

        <div class="profile-form__actions">
          <app-button type="submit" [disabled]="profileForm().submitting() || profileForm().invalid()">
            {{ (profileForm().submitting() ? 'profile.saving' : 'profile.save') | t }}
          </app-button>
          <app-button fill="outline" [routerLink]="'/profile'" [disabled]="profileForm().submitting()">
            {{ 'profile.cancel' | t }}
          </app-button>
        </div>
      </form>
    </section>
  }
</app-page-layout>
