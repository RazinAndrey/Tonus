<app-page-layout>
  <div class="profile-fields">
    <ion-input
      label="Имя"
      labelPlacement="stacked"
      fill="outline"
      mode="md"
      type="text"
      autocomplete="name" />
    <ion-input
      label="Email"
      labelPlacement="stacked"
      fill="outline"
      mode="md"
      type="email"
      autocomplete="email" />
    <ion-input
      label="Телефон"
      labelPlacement="stacked"
      fill="outline"
      mode="md"
      type="tel"
      autocomplete="tel" />
  </div>
</app-page-layout>
