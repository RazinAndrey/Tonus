<ion-split-pane when="md" contentId="main">
  <ion-menu #sidebarMenu contentId="main">
    <ion-header class="ion-no-border">
      <ion-toolbar class="menu-toolbar" routerLink="/dashboard" (click)="sidebarMenu.close()">
        <ion-icon name="trophy" class="menu-logo" size="large" slot="start"></ion-icon>
        <ion-title class="menu-title">
          Tonus
          <span class="menu-subtitle">{{ 'brand.subtitle' | t }}</span>
        </ion-title>
      </ion-toolbar>
    </ion-header>
    <ion-content class="ion-padding">
      <app-sidebar-menu />
    </ion-content>
  </ion-menu>

  <div id="main" class="ion-page main-pane">
    <ion-header class="ion-no-border">
      <app-page-header />
    </ion-header>

    <ion-router-outlet />
  </div>
</ion-split-pane>
