<ion-select
  [label]="label()"
  labelPlacement="stacked"
  fill="outline"
  mode="md"
  interface="popover"
  [placeholder]="placeholder()"
  [value]="value()"
  [disabled]="disabled()"
  (ionChange)="onSelect($event.detail.value)"
  (ionBlur)="onBlur()">
  @for (option of options(); track option.value) {
    <ion-select-option [value]="option.value" [disabled]="option.disabled ?? false">
      {{ option.label }}
    </ion-select-option>
  }
</ion-select>
