<ion-input
  [label]="label()"
  labelPlacement="stacked"
  fill="outline"
  mode="md"
  [type]="resolvedType()"
  [autocomplete]="autocomplete()"
  [value]="value()"
  [disabled]="disabled()"
  [helperText]="errorText()"
  [attr.data-invalid]="errorText() ? '' : null"
  (ionInput)="onInput($event.detail.value)"
  (ionBlur)="onBlur()">
  @if (type() === 'password') {
    <ion-button
      slot="end"
      fill="clear"
      type="button"
      class="password-toggle"
      [attr.aria-label]="(showPassword() ? 'input.hidePassword' : 'input.showPassword') | t"
      (click)="togglePasswordVisibility()">
      <ion-icon slot="icon-only" [name]="showPassword() ? 'eye-off-outline' : 'eye-outline'" />
    </ion-button>
  }
</ion-input>
